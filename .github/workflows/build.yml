name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Show project files (للتشخيص)
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name "settings.gradle*" -o -maxdepth 3 -name "gradlew"

      - name: Build debug APK
        run: |
          # يبحث عن مجلد المشروع تلقائيًا (حيث يوجد settings.gradle)
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle*' | head -n 1)")
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
